worker_processes 1;

events {
    worker_connections 1024;
}

http {
    client_max_body_size 100M;

    # Map to handle WebSocket upgrade dynamically
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Docker's embedded DNS server, used to re-resolve the backend hostname
    # periodically instead of caching it for the container's entire lifetime.
    resolver 127.0.0.11 valid=10s;

    server {
        listen 80;
        server_name localhost;

        location /graphql {
            set $ecommerce_server ecommerce-server:9091;
            proxy_pass http://$ecommerce_server;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-NginX-Proxy true;
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_redirect off;

            # WebSocket headers
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Increase timeouts for WebSocket connections
            proxy_connect_timeout 7d;
            proxy_send_timeout 7d;
            proxy_read_timeout 7d;
            send_timeout 7d;
        }
    }

    # Optional: Enable detailed logging for debugging
    error_log /var/log/nginx/error.log debug;
}